name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    name: Nix checks (test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: bryggio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check

  cross-build:
    name: Cross-build aarch64 (Pi 4B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: bryggio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#bryggio-aarch64

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bryggui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: bryggui/package-lock.json
      - run: npm ci
      - run: npm run ci
